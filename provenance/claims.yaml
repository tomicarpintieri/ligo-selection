claims:
- id: control_gw150914
  statement: This repository independently recovers GW150914 in both detectors with the expected
    SNR and arrival-time offset.
  evidence:
  - tests/test_01_control.py
  - src/gwsel/filtering.py::search
  numbers:
  - h1_peak_snr
  - l1_peak_snr
  - h1_sigma
  - time_delay_ms
  - welch_vs_gwpy_pct
  - background_mean_rho2
- id: waveform_agrees_with_lal
  statement: Our non-spinning 3.5PN TaylorF2 waveform agrees with LAL on amplitude and phase.
  evidence:
  - tests/test_02_waveform.py
  numbers:
  - amplitude_ratio_vs_lal
  - match_vs_lal
- id: inspiral_only_is_a_floor
  statement: Inspiral-only templates underestimate heavy-system detectability; an IMR waveform
    is the alternative but is shipped only for one mass pair.
  evidence:
  - TASKS/day-2-waveform.md
  numbers:
  - snr_taylorf2_real_data
- id: threshold_is_a_distance
  statement: 'An SNR threshold on a fixed waveform is a distance, and therefore a searched
    volume: for GW150914 at rho = 8 that is 1.97 Gpc and 32 Gpc^3, and halving the threshold
    multiplies the volume by eight.'
  evidence:
  - tests/test_03_horizon.py
  - src/gwsel/horizon.py::horizon_distance
  - src/gwsel/horizon.py::sensitive_volume_euclidean
  numbers:
  - horizon_gw150914_mpc
  - sensitive_volume_gpc3
  - volume_threshold_log_slope
- id: selection_tilts_towards_heavy
  statement: 'While the analysis band is fixed the horizon grows as chirp mass to the 5/6,
    so heavier binaries are drawn from a larger volume and a catalogue over-represents them.
    The law stops holding once the merger itself falls into the band: the curve turns over
    near Mc = 27 Msun and falls after.'
  evidence:
  - tests/test_03_horizon.py
  - scripts/s03_horizon.py::fit_window_max
  - Roulet & Zaldarriaga 2019, Fig. 3
  numbers:
  - horizon_mchirp_exponent
  - horizon_fit_window_max_mchirp
  - horizon_peak_mchirp
  - horizon_peak_mpc
- id: detector_has_blind_spots
  statement: An L-shaped detector has four exact geometric blind directions in its detector
    frame.
  evidence:
  - tests/test_04_antenna.py
  numbers:
  - sky_mean_fplus_squared
  - sky_mean_fcross_squared
- id: range_is_2p26_below_horizon
  statement: The volume-equivalent detector range is 2.2649 times smaller than its optimally
    oriented horizon.
  evidence:
  - tests/test_04_antenna.py
  numbers:
  - horizon_over_range_factor
  - rms_projection_factor
- id: network_covers_the_blind_spots
  statement: The combined H1–L1 response has no common blind direction on the sampled sky.
  evidence:
  - tests/test_05_network.py
  numbers:
  - network_sky_average_gain
- id: detectability_depends_on_time_of_day
  statement: Because detector response is Earth-fixed, the network response sweeps across
    celestial coordinates in one sidereal day.
  evidence:
  - figures/f06_rotation.gif
  numbers: []
- id: gw150914_timing_is_consistent
  statement: The measured −7.08 ms H1–L1 delay selects a non-empty sky ring; it is a consistency
    check, not a localisation.
  evidence:
  - tests/test_05_network.py
  numbers:
  - time_delay_l1_minus_h1_ms
  - h1_l1_light_travel_ms
figures:
- file: figures/f01_snr_timeseries.png
  produced_by: src/gwsel/figures.py::f01_snr_timeseries
  shows: H1 and L1 matched-filter SNR around GW150914, with their measured peaks and timing
    offset.
  from_scratch: Computed and plotted the two filter outputs.
  from_library: matplotlib plotting.
  choices:
  - 4 s Welch segments with 50% overlap
  - median PSD for glitch robustness
  - H1 PSD from its first 512 s off source
  - 20–1024 Hz analysis band
  - Tukey window with alpha 0.125
  supports:
  - control_gw150914
- file: figures/f02_waveform_vs_lal.png
  produced_by: src/gwsel/figures.py::f02_waveform_vs_lal
  shows: Amplitude ratio of our TaylorF2 waveform and LAL reference.
  from_scratch: Computed SPA waveform.
  from_library: matplotlib.
  choices:
  - 3.5PN non-spinning TaylorF2 phase
  - 0PN amplitude
  - full LAL comparison grid; f_ISCO reported as physical boundary
  - 20-150 Hz amplitude band
  - 20-300 Hz match band
  - Blanchet 2014 TaylorF2 coefficients
  supports:
  - waveform_agrees_with_lal
- file: figures/f03_horizon_vs_mchirp.png
  produced_by: src/gwsel/figures.py::f03_horizon_vs_mchirp
  shows: Horizon distance against chirp mass on log axes, with GW150914 marked. It rises as
    the 5/6 power while the signal fills the band, turns over near Mc = 27 Msun once the merger
    drops below the band, and falls after. Euclidean, so past a few Gpc it is a scale and
    not a distance.
  from_scratch: Computed the whole curve from our own waveform and the measured H1 PSD.
  from_library: matplotlib for the drawing.
  choices:
  - detection threshold rho = 8, not the 9 of Roulet & Zaldarriaga 2019
  - 'Euclidean sensitive volume: no redshift, no expansion'
  - H1 PSD estimated off-source from the first 512 s
  - optimal orientation and sky position, which makes this a horizon and not a range; day
    4's factor of 2.26 is what separates the two
  - equal-mass binaries along the whole curve
  - waveform cut at f_ISCO, and the curve stopped at Mc = 80 Msun because above it f_ISCO
    falls below the 20 Hz band edge
  - fit window derived from BAND_FIXED_TOLERANCE = 0.999 (Mc <= 2.385) instead of the brief's
    [1.5, 5], which is too wide for the band to count as fixed
  supports:
  - threshold_is_a_distance
  - selection_tilts_towards_heavy
- file: figures/f04_antenna_pattern.png
  produced_by: src/gwsel/figures.py::f04_antenna_pattern
  shows: Detector-frame antenna response and its four exact null directions.
  from_scratch: Evaluated the analytic antenna pattern on a regular angular grid.
  from_library: matplotlib.
  choices:
  - 4,000,000 Monte-Carlo samples
  - random seed 0
  - theta measured from detector zenith
  - phi measured from the x arm
  - psi as polarization angle
  - uniform cos(theta) for isotropic sky sampling
  supports:
  - detector_has_blind_spots
  - range_is_2p26_below_horizon
- file: figures/f05_network_skymap.png
  produced_by: src/gwsel/figures.py::f05_network_skymap
  shows: H1, L1 and combined celestial response, with the −7.08 ms timing ring.
  from_scratch: Evaluated both detector antenna patterns and the geometric delay over a sky
    grid.
  from_library: matplotlib.
  choices:
  - 100,000 isotropic sky directions
  - random seed 0
  - GPS 1126259462.4
  - network response as sum of detector response squared
  - LIGO T030215 H1/L1 site coordinates
  - WGS84 Earth-fixed baseline for the light-travel bound
  supports:
  - network_covers_the_blind_spots
  - gw150914_timing_is_consistent
- file: figures/f06_rotation.gif
  produced_by: src/gwsel/figures.py::f06_rotation
  shows: A sidereal day of combined network response sweeping across the celestial sphere.
  from_scratch: Evaluated the Earth-fixed antenna pattern in 24 frames.
  from_library: matplotlib Pillow writer.
  choices:
  - 100,000 isotropic sky directions
  - random seed 0
  - GPS 1126259462.4
  - network response as sum of detector response squared
  - LIGO T030215 H1/L1 site coordinates
  - WGS84 Earth-fixed baseline for the light-travel bound
  - 24 sidereal-hour frames
  supports:
  - detectability_depends_on_time_of_day
- file: figures/f06_rotation_panels.png
  produced_by: src/gwsel/figures.py::f06_rotation
  shows: Four static frames sampled from the sidereal-day response sweep.
  from_scratch: Evaluated the Earth-fixed antenna pattern at four sidereal hours.
  from_library: matplotlib.
  choices:
  - 100,000 isotropic sky directions
  - random seed 0
  - GPS 1126259462.4
  - network response as sum of detector response squared
  - LIGO T030215 H1/L1 site coordinates
  - WGS84 Earth-fixed baseline for the light-travel bound
  - 24 sidereal-hour frames
  supports:
  - detectability_depends_on_time_of_day
