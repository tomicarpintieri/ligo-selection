name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce analysis on Windows / Python 3.12.10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Create the documented project environment
        run: python -m venv .venv
      - name: Install exact analysis environment in .venv
        run: .venv\Scripts\python.exe -m pip install --upgrade pip && .venv\Scripts\python.exe -m pip install -r requirements.lock
      - name: Fetch pinned inputs, regenerate outputs, and run all checks
        run: .venv\Scripts\python.exe scripts/reproduce.py
      - name: Upload successful-run record
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-${{ github.sha }}
          path: |
            artifacts/reproduction.json
            results.json
            page/index.html
            figures/
          if-no-files-found: error
